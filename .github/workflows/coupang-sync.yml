name: Coupang Partners Auto-Sync

on:
  schedule:
    # 매일 한국 시간 오전 6시 (UTC 21:00) 자동 실행
    - cron: '0 21 * * *'
  workflow_dispatch: # GitHub 웹에서 'Run workflow' 버튼으로 언제든 수동 실행 가능

permissions:
  contents: write

jobs:
  sync-coupang:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Coupang Partners Sync
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: node scripts/coupang_partners.mjs sync

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet src/config/monetization.ts src/data/coupang_catalog.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/config/monetization.ts src/data/coupang_catalog.json
          git commit -m "chore(coupang): auto-sync latest product pricing and affiliate links"
          git push origin main

